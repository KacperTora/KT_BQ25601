[platformio]
src_dir = examples/02_ReadStatus
lib_dir = .

[env:xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:esp32_wroom]
platform = espressif32
board = esp32dev
framework = arduino

[env:arduino_uno]
platform = atmelavr
board = uno
framework = arduino